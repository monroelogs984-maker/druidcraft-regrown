plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = '0.0.14-1.21.1'
group = 'com.vulp.druidcraftrg'

base {
    archivesName = 'druidcraftrg'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
    server {
        programArgument '--nogui'
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url 'https://maven.blamejared.com' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Local jars (no network available during port) — replace with maven coords once online:
    //   TerraBlender: com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8
    //   JEI: mezz.jei:jei-1.21.1-neoforge:19.27.0.336
    implementation fileTree(dir: 'libs', include: ['TerraBlender-neoforge-1.21.1-4.1.0.8.jar'])
    compileOnly fileTree(dir: 'libs', include: ['jei-1.21.1-neoforge-19.27.0.336.jar'])
    runtimeOnly fileTree(dir: 'libs', include: ['jei-1.21.1-neoforge-19.27.0.336.jar'])
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'druidcraftrg',
            'Specification-Vendor'    : 'VulpTheHorseDog',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : "${version}",
            'Implementation-Vendor'   : 'VulpTheHorseDog',
            'MixinConfigs'            : 'druidcraftrg.mixins.json'
        ])
    }
}

tasks.register('deploy', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "druidcraftrg-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/S202Neoforge/mods'
}

tasks.register('deployTest', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "druidcraftrg-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/1.21.1/mods'
}

deploy.finalizedBy deployTest
