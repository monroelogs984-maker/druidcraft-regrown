plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '0.0.13-1.20.1'
group = 'com.vulp.druidcraftrg'
archivesBaseName = 'druidcraftrg'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                druidcraftrg { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            property 'forge.logging.console.level', 'debug'
            mods {
                druidcraftrg { source sourceSets.main }
            }
        }
    }
}

repositories {
    maven { url 'https://maven.blamejared.com' } // JEI
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // optional at runtime — darkwood forest biome injection (guarded by ModList.isLoaded)
    implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.10")
    // optional at runtime — plugin class is only loaded by JEI itself
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.134")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.134")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.134")
}

mixin {
    add sourceSets.main, 'druidcraftrg.refmap.json'
    config 'druidcraftrg.mixins.json'
}

jar {
    manifest {
        attributes([
            'Specification-Title'      : 'druidcraftrg',
            'Specification-Vendor'     : 'VulpTheHorseDog',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : "${version}",
            'Implementation-Vendor'    : 'VulpTheHorseDog',
            'MixinConfigs'             : 'druidcraftrg.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

task deploy {
    dependsOn build
    doLast {
        copy {
            from "build/libs/${archivesBaseName}-${version}.jar"
            into '/home/glenn/Documents/curseforge/minecraft/Instances/1.20.1 (1)/mods'
        }
        println "[DEPLOY] druidcraftrg → 1.20.1 test instance"
    }
}
